<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sorted</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta name="theme-color" content="#152A4D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sorted" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  body { margin: 0; }
  .wn-scope {
    --ink: #152A4D;
    --paper: #EEF1F6;
    --card: #FBFCFE;
    --amber: #C88A2E;
    --teal: #3B5D82;
    --rust: #B85C38;
  }
  .wn-root { background: var(--paper); font-family: 'IBM Plex Sans', sans-serif; color: var(--ink); }
  .wn-display { font-family: 'Space Grotesk', sans-serif; }
  .wn-mono { font-family: 'IBM Plex Mono', monospace; }
  .wn-card { background: var(--card); border: 1px solid rgba(21,42,77,0.1); }
  @keyframes wnRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .wn-rise { animation: wnRise 0.5s ease both; }
  @media (prefers-reduced-motion: reduce) { .wn-rise { animation: none; } }
  .wn-focus:focus-visible { outline: 2px solid #3B5D82; outline-offset: 2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const IconBase = ({ children, size = 20, color = 'currentColor', className = '' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {children}
  </svg>
);
const Car = (props) => (<IconBase {...props}><path d="M4 16l1-5a2 2 0 012-2h10a2 2 0 012 2l1 5" /><rect x="3" y="16" width="18" height="4" rx="1" /><circle cx="7.5" cy="20" r="1.5" /><circle cx="16.5" cy="20" r="1.5" /></IconBase>);
const Briefcase = (props) => (<IconBase {...props}><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2" /><path d="M3 12h18" /></IconBase>);
const Wallet = (props) => (<IconBase {...props}><path d="M3 7a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" /><path d="M16 12h3a1 1 0 011 1v2a1 1 0 01-1 1h-3a2 2 0 010-4z" /></IconBase>);
const MessageCircle = (props) => (<IconBase {...props}><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z" /></IconBase>);
const XIcon = (props) => (<IconBase {...props}><path d="M18 6L6 18M6 6l12 12" /></IconBase>);
const Send = (props) => (<IconBase {...props}><path d="M22 2L11 13" /><path d="M22 2l-7 20-4-9-9-4 20-7z" /></IconBase>);
const ArrowLeft = (props) => (<IconBase {...props}><path d="M19 12H5" /><path d="M12 19l-7-7 7-7" /></IconBase>);
const Loader2 = (props) => (<IconBase {...props}><path d="M21 12a9 9 0 11-9-9" /></IconBase>);
const ExternalLink = (props) => (<IconBase {...props}><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" /><path d="M15 3h6v6" /><path d="M10 14L21 3" /></IconBase>);
const Clock = (props) => (<IconBase {...props}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 3" /></IconBase>);
const ShieldCheck = (props) => (<IconBase {...props}><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" /><path d="M9 12l2 2 4-4" /></IconBase>);
const Copy = (props) => (<IconBase {...props}><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 012-2h10" /></IconBase>);
const Check = (props) => (<IconBase {...props}><path d="M20 6L9 17l-5-5" /></IconBase>);
const Phone = (props) => (<IconBase {...props}><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z" /></IconBase>);

const BRAND = "Sorted";

const PILLARS = [
  {
    id: 'motor',
    prompt: 'A car accident just happened',
    label: 'Motor accidents',
    sub: 'What to do, and how RAF claims work',
    icon: Car,
    steps: [
      { title: 'Stop and check for injuries', body: "Pull over safely if you can, and check yourself and others before anything else. Call 10111 (SAPS) or 112 from a cell phone if anyone is hurt.", urgent: true },
      { title: "Don't argue about fault at the scene", body: "Exchange details calmly. You don't need to admit or argue about who was responsible right now — that gets worked out later, with evidence." },
      { title: 'Collect the details', body: "Get the other driver's name, ID number, contact details, vehicle registration, and insurance details if they have them. Photograph both vehicles, the scene, and any damage or injuries." },
      { title: 'Get a police case number', body: 'Accidents involving injury or death must be reported to SAPS. Ask for the case (CAS) number — any claim will need it.' },
      { title: 'Look into a RAF claim', body: "If you or a passenger were injured, you may be able to claim from the Road Accident Fund. It's a no-fault scheme, so you don't need to prove who caused the accident to claim for your own injuries.", highlight: true },
      { title: "Don't leave it too long", body: 'RAF claims have strict time limits. Getting medical records and the accident report together early makes for a stronger claim.', urgent: true },
    ],
  },
  {
    id: 'dismissal',
    prompt: 'I was just dismissed from work',
    label: 'Workplace dismissal',
    sub: 'Unfair dismissal and the CCMA process',
    icon: Briefcase,
    steps: [
      { title: 'Work out what kind of unfair it is', body: 'Dismissal can be unfair because of the reason behind it, or because of how it was handled — like skipping a proper hearing. Both count.' },
      { title: 'Gather your paperwork', body: 'Your employment contract, the dismissal letter, any disciplinary notices, and relevant emails or messages.' },
      { title: 'Watch the clock', body: "You generally have a limited window to refer a dismissal dispute to the CCMA after the dismissal date. Don't sit on it.", urgent: true },
      { title: 'Refer the dispute to the CCMA', body: "It's free, and built so you don't need a lawyer to do it. The CCMA has offices across the country." },
      { title: 'Expect conciliation first', body: "A commissioner will try to help you and your employer reach an agreement. If that doesn't work, it can move to arbitration, where a ruling is made." },
      { title: 'Get advice before you go in', body: 'You can represent yourself, but a quick consultation with a labour law expert beforehand can help you prepare.', highlight: true },
    ],
  },
  {
    id: 'credit',
    prompt: "I'm struggling with debt",
    label: 'Credit & debt',
    sub: 'Debt review and your rights under the NCA',
    icon: Wallet,
    steps: [
      { title: 'Get the full picture', body: "List every debt, your income, and your essential monthly expenses. You can't fix what you haven't mapped out." },
      { title: 'Understand debt review', body: "It's a process under the National Credit Act where a registered debt counsellor restructures your debts into one affordable monthly payment." },
      { title: 'Know the protection it gives', body: "Once you're under debt review, credit providers generally can't take further legal action against you, as long as you keep to the plan.", highlight: true },
      { title: "Check who you're dealing with", body: 'Only counsellors registered with the National Credit Regulator (NCR) can legally place you under debt review. Always check the registration number.', urgent: true },
    ],
    handoff: {
      name: 'Solace Debt Counselling',
      body: 'NCR-registered debt counsellor (NCRDC3316), based in Cape Town, and meets clients face-to-face.',
      url: 'https://wa.me/27785048467?text=' + encodeURIComponent('Hi, I need help with debt review — I found you through the Sorted app.'),
    },
  },
];

const SEXUAL_ASSAULT_PATTERNS = [/\brape[d]?\b/i, /\bsexual(ly)? assault/i, /\bmolest/i];
const SELF_HARM_PATTERNS = [/\bsuicid/i, /\bkill myself\b/i, /\bwant to die\b/i, /\bend my life\b/i, /\bself.?harm/i];
const DANGER_PATTERNS = [/\bhe'?s? (going to|gonna) (kill|hurt) me\b/i, /\bshe'?s? (going to|gonna) (kill|hurt) me\b/i, /\bdomestic violence\b/i, /\bin (immediate )?danger\b/i];

function detectCrisis(text) {
  if (SEXUAL_ASSAULT_PATTERNS.some((re) => re.test(text))) return 'sexual_assault';
  if (SELF_HARM_PATTERNS.some((re) => re.test(text))) return 'self_harm';
  if (DANGER_PATTERNS.some((re) => re.test(text))) return 'danger';
  return null;
}

const CRISIS_REPLIES = {
  sexual_assault:
    "I'm really sorry this happened to you. Right now, your safety and your health matter far more than any legal process.\n\nIf you're in immediate danger, call 10111 (or 112 from a cell phone).\n\nGetting to a hospital soon matters — South Africa's Thuthuzela Care Centres offer free medical care (including HIV prevention medication, most effective within 72 hours), a private space, and support with reporting, all in one visit, even if you haven't decided whether to open a case yet. The Gender-Based Violence Command Centre (0800 428 428) is open 24/7 and can talk you through it and connect you to a centre near you.\n\nThis app can explain how reporting and the legal process generally work whenever you're ready for that — but please reach out to one of the above first.",
  self_harm:
    "I'm glad you said something. What you're feeling matters, and you don't have to manage it alone.\n\nSADAG's Suicide Crisis Helpline is free and available right now, 24/7: 0800 567 567. If you're in immediate danger, call 10111 or get to your nearest hospital.\n\nThis app is built for legal questions, so it isn't the right tool for what you're going through right now — but please reach out to the number above.",
  danger:
    "Your safety comes first. If you're in immediate danger, call 10111 (or 112 from a cell phone) now.\n\nFor ongoing abuse or domestic violence, the Gender-Based Violence Command Centre (0800 428 428) is open 24/7 and can talk you through safe next steps and connect you to shelter or support nearby.\n\nOnce you're safe, this app can help explain the legal process — but please reach out to one of the above first.",
};

function App() {
  const [activePillar, setActivePillar] = useState(null);
  const [chatOpen, setChatOpen] = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [landingQuery, setLandingQuery] = useState('');
  const [loading, setLoading] = useState(false);
  const [copiedIndex, setCopiedIndex] = useState(null);
  const [leadAskShown, setLeadAskShown] = useState(false);
  const [showLeadAsk, setShowLeadAsk] = useState(false);
  const [leadSubmitted, setLeadSubmitted] = useState(false);
  const [leadForm, setLeadForm] = useState({ name: '', phone: '', email: '' });
  const [leadContextQuestion, setLeadContextQuestion] = useState('');

  const handleCopy = (text, index) => {
    if (!navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(() => {
      setCopiedIndex(index);
      setTimeout(() => setCopiedIndex((current) => (current === index ? null : current)), 2000);
    });
  };
  const scrollRef = useRef(null);
  const [installPrompt, setInstallPrompt] = useState(null);

  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
    }
  }, [messages, loading]);

  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    const handler = (e) => {
      e.preventDefault();
      setInstallPrompt(e);
    };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  const handleInstallClick = async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    await installPrompt.userChoice;
    setInstallPrompt(null);
  };

  const submitQuestion = async (questionText) => {
    const question = questionText.trim();
    if (!question || loading) return;
    const nextMessages = [...messages, { role: 'user', content: question }];
    setMessages(nextMessages);

    const crisis = detectCrisis(question);
    if (crisis) {
      setMessages((prev) => [...prev, { role: 'assistant', content: CRISIS_REPLIES[crisis], urgentCall: '10111' }]);
      return;
    }

    setLoading(true);
    try {
      const response = await fetch('https://sorted-backend-production.up.railway.app/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: nextMessages.map((m) => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await response.json();
      if (!response.ok) {
        console.error('API error', response.status, data);
        throw new Error((data && data.error) || ('Request failed (' + response.status + ')'));
      }
      setMessages((prev) => [...prev, { role: 'assistant', content: data.reply || "Sorry, I couldn't work that out. Try asking again." }]);
      if (!leadAskShown) {
        setLeadAskShown(true);
        setShowLeadAsk(true);
        setLeadContextQuestion(question);
      }
    } catch (err) {
      console.error('Chat error', err);
      const detail = err && err.message ? err.message : String(err);
      setMessages((prev) => [...prev, { role: 'assistant', content: 'Something went wrong reaching the assistant — ' + detail }]);
    } finally {
      setLoading(false);
    }
  };

  const handleLeadSubmit = async () => {
    if (!leadForm.phone.trim() && !leadForm.email.trim()) return;
    try {
      await fetch('https://sorted-backend-production.up.railway.app/api/leads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...leadForm, question: leadContextQuestion }),
      });
    } catch (err) {
      console.error('Lead submit error', err);
    }
    setLeadSubmitted(true);
  };

  const handleModalSend = () => {
    const question = input;
    setInput('');
    submitQuestion(question);
  };

  const handleLandingSubmit = () => {
    const question = landingQuery;
    setLandingQuery('');
    setChatOpen(true);
    submitQuestion(question);
  };

  const pillar = PILLARS.find((p) => p.id === activePillar) || null;
  const PillarIcon = pillar ? pillar.icon : null;

  return (
    <div className="wn-scope wn-root min-h-screen w-full relative">
      <header className="px-6 py-6 flex items-center justify-between border-b" style={{ borderColor: 'rgba(21,42,77,0.12)' }}>
        <div className="flex items-center gap-3">
          <svg width="50" height="50" viewBox="0 0 120 120" className="shrink-0">
            <rect x="14" y="6" width="92" height="108" rx="20" fill="#152A4D" />
            <path d="M 32 62 L 52 82 L 90 34" fill="none" stroke="#C88A2E" strokeWidth="11" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
          <div>
            <div className="wn-display text-4xl font-bold tracking-tight">{BRAND}</div>
            <div className="text-xs opacity-70 mt-0.5">Plain-language help for South Africans</div>
          </div>
        </div>
        {pillar && (
          <button
            onClick={() => setActivePillar(null)}
            className="wn-focus flex items-center gap-1.5 text-sm font-medium px-3 py-1.5 rounded-full wn-card"
          >
            <ArrowLeft size={14} /> All situations
          </button>
        )}
      </header>

      {installPrompt && (
        <div className="flex items-center justify-between gap-3 px-4 py-2" style={{ background: 'rgba(21,42,77,0.06)' }}>
          <span className="text-xs" style={{ color: '#152A4D' }}>
            Add Sorted to your home screen for one-tap access
          </span>
          <div className="flex items-center gap-2 shrink-0">
            <button
              onClick={handleInstallClick}
              className="wn-focus text-xs font-semibold px-3 py-1.5 rounded-full"
              style={{ background: '#152A4D', color: '#EEF1F6' }}
            >
              Install
            </button>
            <button
              onClick={() => setInstallPrompt(null)}
              className="wn-focus opacity-50 hover:opacity-100"
              aria-label="Dismiss"
            >
              <XIcon size={14} />
            </button>
          </div>
        </div>
      )}

      <a
        href="tel:10111"
        className="wn-focus flex items-center justify-center gap-1.5 py-2 text-xs font-medium"
        style={{ background: 'rgba(184,92,56,0.1)', color: '#B85C38' }}
      >
        <Phone size={12} /> In immediate danger? Call 10111 (SAPS) now
      </a>

      {!pillar && (
        <div className="px-6 py-10 max-w-2xl mx-auto">
          <h1 className="wn-display text-3xl font-bold leading-tight wn-rise">What's going on?</h1>
          <p className="mt-3 opacity-80 wn-rise" style={{ animationDelay: '0.05s' }}>
            Ask a legal question, or get help drafting a letter — a complaint, a dispute response, whatever you need. We'll explain how it generally works in South Africa, and point you to the right next step.
          </p>

          <div className="mt-6 flex gap-2 wn-rise" style={{ animationDelay: '0.1s' }}>
            <input
              value={landingQuery}
              onChange={(e) => setLandingQuery(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') handleLandingSubmit();
              }}
              placeholder="e.g. My landlord won't return my deposit..."
              className="wn-focus wn-card flex-1 text-sm px-4 py-3.5 rounded-xl outline-none"
            />
            <button
              onClick={handleLandingSubmit}
              disabled={!landingQuery.trim()}
              className="wn-focus shrink-0 w-12 rounded-xl flex items-center justify-center"
              style={{ background: '#152A4D', color: '#EEF1F6', opacity: landingQuery.trim() ? 1 : 0.4 }}
            >
              <Send size={16} />
            </button>
          </div>

          <div className="mt-10 wn-rise" style={{ animationDelay: '0.18s' }}>
            <span className="wn-mono text-xs opacity-50">COMMON SITUATIONS</span>
            <div className="mt-4 space-y-3">
              {PILLARS.map((p, i) => {
                const Icon = p.icon;
                return (
                  <button
                    key={p.id}
                    onClick={() => setActivePillar(p.id)}
                    className="wn-focus wn-card w-full text-left p-5 rounded-2xl flex items-start gap-4 hover:shadow-md transition-shadow"
                  >
                    <div
                      className="shrink-0 w-11 h-11 rounded-full flex items-center justify-center"
                      style={{ background: 'rgba(200,138,46,0.15)' }}
                    >
                      <Icon size={20} color="#C88A2E" />
                    </div>
                    <div>
                      <div className="font-semibold" style={{ fontSize: '1.05rem' }}>
                        {p.prompt}
                      </div>
                      <div className="text-sm opacity-70 mt-0.5">{p.sub}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {pillar && (
        <div className="px-6 py-8 max-w-2xl mx-auto">
          <div className="flex items-center gap-3 wn-rise">
            <div
              className="w-11 h-11 rounded-full flex items-center justify-center shrink-0"
              style={{ background: 'rgba(200,138,46,0.15)' }}
            >
              <PillarIcon size={20} color="#C88A2E" />
            </div>
            <div>
              <h1 className="wn-display text-2xl font-bold">{pillar.label}</h1>
              <p className="text-sm opacity-70">{pillar.sub}</p>
            </div>
          </div>

          <div className="mt-8 space-y-4">
            {pillar.steps.map((step, i) => (
              <div
                key={i}
                className="wn-card wn-rise rounded-2xl p-5"
                style={{
                  animationDelay: `${i * 0.06}s`,
                  borderLeft: step.urgent ? '3px solid #B85C38' : step.highlight ? '3px solid #C88A2E' : '3px solid transparent',
                }}
              >
                <div className="flex items-start gap-3">
                  <span className="wn-mono text-xs font-medium shrink-0 mt-0.5 opacity-50">
                    STEP {String(i + 1).padStart(2, '0')}
                  </span>
                  <div>
                    <div className="font-semibold flex items-center gap-2">
                      {step.title}
                      {step.urgent && <Clock size={14} color="#B85C38" />}
                    </div>
                    <p className="text-sm opacity-80 mt-1 leading-relaxed">{step.body}</p>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {pillar.handoff && (
            <a
              href={pillar.handoff.url}
              target="_blank"
              rel="noopener noreferrer"
              className="wn-focus mt-6 block rounded-2xl p-5 wn-rise"
              style={{ background: '#152A4D', color: '#EEF1F6', border: '1px solid rgba(200,138,46,0.4)' }}
            >
              <div className="flex items-center justify-between gap-3">
                <div>
                  <div className="wn-display font-bold flex items-center gap-2">
                    <ShieldCheck size={16} /> {pillar.handoff.name}
                  </div>
                  <p className="text-sm opacity-80 mt-1">{pillar.handoff.body}</p>
                </div>
                <MessageCircle size={18} className="shrink-0" />
              </div>
            </a>
          )}
        </div>
      )}

      <footer
        className="px-6 py-8 max-w-2xl mx-auto text-xs opacity-60 leading-relaxed border-t mt-6"
        style={{ borderColor: 'rgba(21,42,77,0.12)' }}
      >
        This is general legal information for South Africa, not legal advice for your specific situation — confirm anything specific with a qualified professional. If you're in immediate danger or need urgent help, contact 10111 (SAPS) or emergency services directly.
      </footer>

      {!chatOpen && (
        <button
          onClick={() => setChatOpen(true)}
          className="wn-focus fixed bottom-5 right-5 rounded-full shadow-lg flex items-center gap-2 px-5 py-3.5"
          style={{ background: '#152A4D', color: '#EEF1F6' }}
        >
          <MessageCircle size={18} />
          <span className="text-sm font-medium">Ask about your situation</span>
        </button>
      )}

      {chatOpen && (
        <div
          className="fixed inset-0 z-50 flex items-end justify-center"
          style={{ background: 'rgba(21,42,77,0.35)' }}
          onClick={() => setChatOpen(false)}
        >
          <div
            className="wn-card w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl flex flex-col"
            style={{ maxHeight: '80vh' }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between px-5 py-4 border-b" style={{ borderColor: 'rgba(21,42,77,0.12)' }}>
              <div className="font-semibold wn-display">Ask about your situation</div>
              <button onClick={() => setChatOpen(false)} className="wn-focus opacity-60 hover:opacity-100">
                <XIcon size={18} />
              </button>
            </div>
            <div ref={scrollRef} className="flex-1 overflow-y-auto px-5 py-4 space-y-3" style={{ minHeight: '240px' }}>
              {messages.length === 0 && (
                <div
                  className="text-sm rounded-xl px-3.5 py-2.5 leading-relaxed"
                  style={{ background: '#EEF1F6', color: '#152A4D', maxWidth: '85%' }}
                >
                  Ask me anything about a legal question in South Africa, or get help drafting a letter — a complaint, a dispute response, whatever you need. What's going on?
                </div>
              )}
              {messages.map((m, i) => (
                <div key={i}>
                  <div
                    className="text-sm rounded-xl px-3.5 py-2.5 leading-relaxed"
                    style={{
                      background: m.role === 'user' ? '#152A4D' : '#EEF1F6',
                      color: m.role === 'user' ? '#EEF1F6' : '#152A4D',
                      maxWidth: '85%',
                      marginLeft: m.role === 'user' ? 'auto' : undefined,
                      whiteSpace: 'pre-line',
                    }}
                  >
                    {m.content}
                  </div>
                  {m.role !== 'user' && (
                    <button
                      onClick={() => handleCopy(m.content, i)}
                      className="wn-focus mt-1 flex items-center gap-1 text-xs px-1"
                      style={{ color: '#152A4D', opacity: 0.55 }}
                    >
                      {copiedIndex === i ? (
                        <>
                          <Check size={12} /> Copied
                        </>
                      ) : (
                        <>
                          <Copy size={12} /> Copy
                        </>
                      )}
                    </button>
                  )}
                  {m.urgentCall && (
                    <a
                      href={'tel:' + m.urgentCall}
                      className="wn-focus mt-2 flex items-center gap-1.5 text-sm font-semibold px-3.5 py-2 rounded-xl"
                      style={{ background: '#B85C38', color: '#FBFCFE', maxWidth: '85%' }}
                    >
                      <Phone size={14} /> Call {m.urgentCall} now
                    </a>
                  )}
                </div>
              ))}
              {loading && (
                <div className="text-sm rounded-xl px-3.5 py-2.5 inline-flex" style={{ background: '#EEF1F6' }}>
                  <Loader2 size={14} className="animate-spin" />
                </div>
              )}
              {showLeadAsk && !leadSubmitted && (
                <div className="wn-card rounded-xl p-3.5" style={{ maxWidth: '85%' }}>
                  <div className="text-sm font-semibold" style={{ color: '#152A4D' }}>
                    Want a text with this?
                  </div>
                  <p className="text-xs opacity-70 mt-0.5 mb-2.5" style={{ color: '#152A4D' }}>
                    Leave your number or email and we can follow up — totally optional.
                  </p>
                  <div className="space-y-1.5">
                    <input
                      value={leadForm.name}
                      onChange={(e) => setLeadForm((f) => ({ ...f, name: e.target.value }))}
                      placeholder="Name (optional)"
                      className="wn-focus w-full text-xs px-2.5 py-2 rounded-lg outline-none"
                      style={{ background: '#EEF1F6', border: '1px solid rgba(21,42,77,0.15)' }}
                    />
                    <input
                      value={leadForm.phone}
                      onChange={(e) => setLeadForm((f) => ({ ...f, phone: e.target.value }))}
                      placeholder="Phone number"
                      className="wn-focus w-full text-xs px-2.5 py-2 rounded-lg outline-none"
                      style={{ background: '#EEF1F6', border: '1px solid rgba(21,42,77,0.15)' }}
                    />
                    <input
                      value={leadForm.email}
                      onChange={(e) => setLeadForm((f) => ({ ...f, email: e.target.value }))}
                      placeholder="Email"
                      className="wn-focus w-full text-xs px-2.5 py-2 rounded-lg outline-none"
                      style={{ background: '#EEF1F6', border: '1px solid rgba(21,42,77,0.15)' }}
                    />
                  </div>
                  <div className="flex gap-2 mt-2.5">
                    <button
                      onClick={handleLeadSubmit}
                      disabled={!leadForm.phone.trim() && !leadForm.email.trim()}
                      className="wn-focus text-xs font-semibold px-3 py-1.5 rounded-full"
                      style={{
                        background: '#152A4D',
                        color: '#EEF1F6',
                        opacity: !leadForm.phone.trim() && !leadForm.email.trim() ? 0.4 : 1,
                      }}
                    >
                      Send
                    </button>
                    <button
                      onClick={() => setShowLeadAsk(false)}
                      className="wn-focus text-xs opacity-50 hover:opacity-100 px-3 py-1.5"
                      style={{ color: '#152A4D' }}
                    >
                      No thanks
                    </button>
                  </div>
                </div>
              )}
              {showLeadAsk && leadSubmitted && (
                <div className="wn-card rounded-xl p-3.5 text-sm" style={{ maxWidth: '85%', color: '#152A4D' }}>
                  Thanks — we'll be in touch if useful.
                </div>
              )}
            </div>
            <div className="p-3 border-t flex gap-2" style={{ borderColor: 'rgba(21,42,77,0.12)' }}>
              <input
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') handleModalSend();
                }}
                placeholder="e.g. How long do I have to claim after a crash?"
                className="wn-focus flex-1 text-sm px-3.5 py-2.5 rounded-xl outline-none"
                style={{ background: '#EEF1F6', border: '1px solid rgba(21,42,77,0.15)' }}
              />
              <button
                onClick={handleModalSend}
                disabled={loading}
                className="wn-focus shrink-0 w-10 h-10 rounded-xl flex items-center justify-center"
                style={{ background: '#152A4D', color: '#EEF1F6', opacity: loading ? 0.5 : 1 }}
              >
                <Send size={16} />
              </button>
            </div>
            <div className="px-5 pb-3 text-xs opacity-50">General information only, not legal advice.</div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
